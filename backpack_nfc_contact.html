<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backpack Contact Information</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f6f8;color:#17202a;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:34px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.10)}
.icon{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:#17202a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px}
h1{margin:0 0 8px;font-size:28px}.subtitle{margin:0 0 28px;color:#66727f;font-size:16px}
.info{background:#f4f6f8;border-radius:16px;padding:20px 16px;margin-bottom:14px}
.label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#66727f;margin-bottom:8px}
.value{font-size:19px;font-weight:600;line-height:1.45}
a{text-decoration:none;color:inherit}
.button{display:block;width:100%;padding:16px;margin-top:14px;border-radius:14px;font-size:17px;font-weight:700}
.call{background:#17202a;color:#fff}.map{background:#e9edf1;color:#17202a}
.note{margin-top:24px;font-size:13px;color:#7b8794;line-height:1.45}
</style>
</head>
<body>
<main class="card">
<div class="icon">🎒</div>
<h1>Backpack Contact</h1>
<p class="subtitle">If this backpack was found, please use the information below.</p>

<div class="info">
<span class="label">Phone</span>
<div class="value"><a href="tel:+15139077803">513-907-7803</a></div>
</div>

<div class="info">
<span class="label">Address</span>
<div class="value">8190 Paddington Court<br>West Chester, Ohio 45069</div>
</div>

<a class="button call" href="tel:+15139077803">📞 Call</a>
<a class="button map" href="https://www.google.com/maps/search/?api=1&query=8190%20Paddington%20Court%2C%20West%20Chester%2C%20OH%2045069">📍 Open Address in Maps</a>

<p class="note">Thank you for helping return this backpack.</p>
</main>
</body>
</html>
